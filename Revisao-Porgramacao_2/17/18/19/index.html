<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Curso Técnico em Desenvolvimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tecnologia da Informação</h1>
        <nav>
            <a href="#sobre">Sobre</a>
            <a href="#grade">Grade</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>
    <main>
        <section id="sobre">
            <h2>Sobre o Curso Técnico</h2>
            <p>Conheça nossa formação completa focada no mercado atual.</p>
            <img src="curso.jpg" alt="Estudante programando">
        </section>
        <section id="grade">
            <h3>Disciplinas</h3>
            <ul>
                <li>Lógica de Programação</li>
                <li>Banco de Dados</li>
                <li>Desenvolvimento Web</li>
            </ul>
            <table>
                <tr><th>Módulo</th><th>Carga Horária</th></tr>
                <tr><td>Módulo I</td><td>400h</td></tr>
            </table>
        </section>
        <section id="contato">
            <h3>Inscreva-se</h3>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Escola Técnica</p>
    </footer>
</body>
</html>
